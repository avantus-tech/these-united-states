name: Build package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Check for uv
        id: uv-check
        run: echo "uv_path=$(command -v uv)" >> $GITHUB_OUTPUT

      - name: Install uv
        if: ${{ !steps.uv-check.outputs.uv_path }}
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build package
        env:
          UV_PYTHON: "3.14"
        run: uv build

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          path: dist
          if-no-files-found: error
          compression-level: 0

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<"EOF"
          **GitHub Run ID:**
          ```
          ${{ github.run_id }}
          ```
          
          **Publish to PyPI**
          After testing the [artifacts](#artifacts) below, copy the Run ID above and use it with the [publish workflow](../workflows/publish.yaml).
          EOF
